name: Build Eqosy apps

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app"
        type: choice
        default: user
        options: [user, driver, partner]
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, driver, partner]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Eqosy/Frontend/package-lock.json
            package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: |
          npm ci --prefix Eqosy/Frontend
          npm ci

      - name: Create .env.ios from secret
        run: echo "${{ secrets.ENV_IOS }}" > .env.ios

      - name: Build web + Android project
        run: node scripts/ios.mjs ${{ matrix.app }} android

      - name: Add google-services.json (optional)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > apps/${{ matrix.app }}/android/app/google-services.json

      - name: Build debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: eqosy-${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk

  ios:
    # Builds the iOS project and checks it compiles (unsigned).
    # Installing on a real iPhone needs signing with an Apple Developer account.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, driver, partner]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Eqosy/Frontend/package-lock.json
            package-lock.json

      - name: Install deps
        run: |
          npm ci --prefix Eqosy/Frontend
          npm ci

      - name: Create .env.ios from secret
        run: echo "${{ secrets.ENV_IOS }}" > .env.ios

      - name: Build web + iOS project
        run: node scripts/ios.mjs ${{ matrix.app }}

      - name: Unsigned compile check
        working-directory: apps/${{ matrix.app }}/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Zip iOS project (open on a Mac in Xcode)
        run: cd apps/${{ matrix.app }} && zip -qr ../../eqosy-${{ matrix.app }}-ios.zip ios -x "ios/App/Pods/*"

      - uses: actions/upload-artifact@v4
        with:
          name: eqosy-${{ matrix.app }}-ios-project
          path: eqosy-${{ matrix.app }}-ios.zip
